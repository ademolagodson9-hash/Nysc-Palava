button:focus-visible,input:focus-visible{outline:3px solid var(--m);outline-offset:2px}

<body>
<div id="app"><div id="hud"></div><div id="stage"></div><div class="body" id="body"></div></div>
<div id="ph"></div><button id="snd" onclick="toggleSnd()" aria-label="Toggle music">🔊</button>
<script>
/* ============ CORE ============ */
const $=s=>document.querySelector(s);
const fmt=n=>'₦'+Math.round(n).toLocaleString('en-NG');
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const rnd=a=>a[Math.floor(Math.random()*a.length)];
const chance=p=>Math.random()<p;
let S=null,CH=[],TM=null,SND=true,C={name:'',g:'f',course:'',pers:'Friendly'};
let ME=null,ONT=true,CFG={allowance:77000,billsMult:1,bettingEnabled:true,registrationOpen:true,maintenance:false,motd:'',announcements:[]};
const E=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(m,u,b){const r=await fetch(u,{method:m,headers:{'Content-Type':'application/json','X-Requested-With':'palava'},body:b?JSON.stringify(b):undefined,credentials:'same-origin'});let j={};try{j=await r.json()}catch(e){}if(!r.ok)throw Object.assign(new Error(j.error||'Request failed'),{status:r.status});return j}
const WX={sunny:'☀️',cloudy:'⛅',rain:'🌧️',heavy:'⛈️',storm:'🌩️',harmattan:'🌫️'};
const ART={
 title:'🇳🇬🚌🎓',aerial:'🛰️🏙️🌅',home:'🏠📱🎒',road:'🚌🛣️🌴',park:'🚐🧳🗣️',gate:'🏫🎖️🚪',queue:'📋🧍🧍🧍',
 hostel:'🛏️🎒💡',parade:'🎖️🪖🇳🇬',market:'🍲🧵📱',field:'⚽🏐🥅',clinic:'🏥💊🩺',hall:'📚✏️🎓',stage:'🎭🥁💃',
 envelope:'✉️✨🇳🇬',city:'🏙️🏍️🚕',ppa:'🏢💼🗂️',school:'🏫📖🔔',room:'🛋️🔑🕯️',night:'🌙🦟💤',grove:'🌳🌿🦋',cds:'🧹🌱🤝',
 ceremony:'🏅🎺🇳🇬',phone:'📱💬💸',pay:'💵🧾🏦'};
const BG={
 title:'#0E6B3B',aerial:'linear-gradient(#f9b86a,#7a5ea8)',home:'linear-gradient(#ffd98a,#f4a259)',road:'linear-gradient(#a8d5e8,#e9e3c8)',
 park:'linear-gradient(#e6d9a8,#c9a96a)',gate:'linear-gradient(#bfe3c9,#6fb48a)',queue:'linear-gradient(#e8e2c4,#c9bf92)',
 hostel:'linear-gradient(#cfd8e8,#9aa7c7)',parade:'linear-gradient(#cdeac0,#7fbf7b)',market:'linear-gradient(#ffe29a,#ff9d5c)',
 field:'linear-gradient(#bfe8a0,#5fae5f)',clinic:'linear-gradient(#e8f4f8,#b9dbe6)',hall:'linear-gradient(#f0e6cf,#cdb98a)',
 stage:'linear-gradient(#5b3f8f,#23235E)',envelope:'linear-gradient(#fff1b8,#f4b400)',city:'linear-gradient(#bcd7ea,#dcd2b0)',
 ppa:'linear-gradient(#dfe7ef,#aab8c9)',school:'linear-gradient(#ffe9a8,#b7d89a)',room:'linear-gradient(#e7d7c1,#b99e7c)',
 night:'linear-gradient(#1b2250,#0b1030)',grove:'linear-gradient(#a8dba0,#3f8a54)',cds:'linear-gradient(#cfe9c1,#8fc77f)',
 ceremony:'linear-gradient(#ffe9a0,#0E6B3B)',phone:'linear-gradient(#cfe0ff,#9bb5ee)',pay:'linear-gradient(#e0f0d0,#a8cf8a)'};
function snd(f,d=.09){if(!SND)return;try{const a=snd.c||(snd.c=new(window.AudioContext||window.webkitAudioContext)());const o=a.createOscillator(),g=a.createGain();o.type='triangle';o.frequency.value=f;g.gain.value=.05;o.connect(g);g.connect(a.destination);o.start();g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+d);o.stop(a.currentTime+d)}catch(e){}}
function toast(m,bad){const t=document.createElement('div');t.className='toast'+(bad?' bad':'');t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),1900);
 if(bad){const a=$('#app');a.classList.remove('shake');void a.offsetWidth;a.classList.add('shake')}else if(/rep|₦|skill|win|Great|Right/i.test(m))burst(rnd(['🎉','✨','💚','🇳🇬','🥁']))}
function burst(e){for(let i=0;i<7;i++){const d=document.createElement('div');d.className='pt';d.textContent=e;d.style.left=(15+Math.random()*70)+'%';d.style.animationDelay=(i*.06)+'s';document.body.appendChild(d);setTimeout(()=>d.remove(),1800)}}
/* ---- Afrobeat-style generated music ---- */
const AC={ctx:null,timer:null,step:0,master:null,nb:null,rg:null,rs:null};
const mf=n=>440*Math.pow(2,(n-69)/12);
function actx(){if(!AC.ctx){try{AC.ctx=new(window.AudioContext||window.webkitAudioContext)();AC.master=AC.ctx.createGain();AC.master.gain.value=.35;AC.master.connect(AC.ctx.destination);const L=AC.ctx.sampleRate*2,b=AC.ctx.createBuffer(1,L,AC.ctx.sampleRate),d=b.getChannelData(0);for(let i=0;i<L;i++)d[i]=Math.random()*2-1;AC.nb=b}catch(e){AC.ctx=null;return null}}if(AC.ctx.state==='suspended')AC.ctx.resume();return AC.ctx}
function tone(f,t,d,type,v){const c=AC.ctx,o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(AC.master);o.start(t);o.stop(t+d+.02)}
function drum(t,f0,f1,d,v){const c=AC.ctx,o=c.createOscillator(),g=c.createGain();o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(f1,t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(AC.master);o.start(t);o.stop(t+d+.02)}
function hat(t,d,v,hp){const c=AC.ctx,r=c.createBufferSource(),g=c.createGain(),f=c.createBiquadFilter();r.buffer=AC.nb;f.type='highpass';f.frequency.value=hp;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);r.connect(f);f.connect(g);g.connect(AC.master);r.start(t);r.stop(t+d+.02)}
const CHORDS=[[57,60,64],[53,57,60],[48,52,55],[55,59,62]],BASS=[45,41,36,43],ARP=[0,3,6,8,11,14];
function musicStep(){const c=AC.ctx;if(!c||!SND)return;const t=c.currentTime+.02,st=AC.step%16,bar=Math.floor(AC.step/16)%4;
 if([0,7,10].includes(st))drum(t,140,45,.18,.9);
 if(st===4||st===12)hat(t,.12,.35,1500);
 if(st%2===0)hat(t,.04,.12,7000);else if(Math.random()<.5)hat(t,.03,.06,8000);
 if([3,11,14].includes(st)&&Math.random()<.8)drum(t,420,220,.12,.3);
 if([0,3,6,10,12].includes(st))tone(mf(BASS[bar]+(st===6?12:0)),t,.25,'sine',.55);
 const ai=ARP.indexOf(st);if(ai>=0)tone(mf(CHORDS[bar][[0,1,2,1,2,1][ai]]+12),t,.22,'triangle',.18);
 AC.step++}
function rainAmb(){const c=AC.ctx;if(!c)return;if(!AC.rs){const r=c.createBufferSource(),f=c.createBiquadFilter(),g=c.createGain();r.buffer=AC.nb;r.loop=true;f.type='lowpass';f.frequency.value=2500;g.gain.value=0;r.connect(f);f.connect(g);g.connect(c.destination);r.start();AC.rs=r;AC.rg=g}AC.rg.gain.value=(SND&&S&&isRain())?.07:0}
function musicOn(){if(!SND)return;if(!actx())return;AC.master.gain.value=.35;if(!AC.timer)AC.timer=setInterval(musicStep,145);rainAmb()}
function musicOff(){if(AC.timer){clearInterval(AC.timer);AC.timer=null}if(AC.master)AC.master.gain.value=0;if(AC.rg)AC.rg.gain.value=0}
function toggleSnd(){SND=!SND;const b=$('#snd');if(b)b.textContent=SND?'🔊':'🔇';SND?musicOn():musicOff()}
const total=()=>S.cash+S.bank;
function pay(n){if(total()<n)return false;let c=Math.min(S.cash,n);S.cash-=c;S.bank-=(n-c);return true}
function earn(n,toBank=true){if(toBank)S.bank+=n;else S.cash+=n;toast('+'+fmt(n))}
function rep(k,n){if(!n)return;if(n>0&&S.phase==='life'){S.wk=S.wk||{};S.wk.g=S.wk.g||{};const u=S.wk.g[k]||0,mx=Math.min(n,8-u);if(mx<=0)return;n=mx;S.wk.g[k]=u+mx}S.rep[k]+=n;const nm={camp:'Camp',ppa:'PPA',comm:'Community',friend:'Friendship',prof:'Professional'}[k];toast((n>0?'+':'')+n+' '+nm+' rep',n<0)}
function sk(k,n){S.sk[k]=clamp(S.sk[k]+n,0,10);toast('+'+n+' '+k+' skill')}
function hp(n){S.hp=clamp(S.hp+n,0,100)}
function en(n){S.en=clamp(S.en+n,0,100)}
const ok=(k,b)=>chance(clamp(b+S.sk[k]*.07+(S.en<25?-.12:0),.1,.95));
function clock(){const h=Math.floor(S.min/60),m=S.min%60;return `${((h+11)%12)+1}:${String(m).padStart(2,'0')} ${h<12?'AM':'PM'}`}
function tick(m){S.min+=m;while(S.min>=1440){S.min-=1440;S.day++;rollWx()}}
function rollWx(){const h=S.month>=3&&S.month<=5&&S.phase==='life';const r=Math.random();S.wx=h&&r<.35?'harmattan':r<.4?'sunny':r<.65?'cloudy':r<.85?'rain':r<.95?'heavy':'storm'}
function msg(from,text){S.chat.unshift({from,text,day:S.day});S.chat=S.chat.slice(0,25)}
const isRain=()=>['rain','heavy','storm'].includes(S&&S.wx);

/* ============ VIEW ============ */
function hudHtml(){if(!S)return'';const b=(v,c)=>`<div class="bar"><i style="width:${clamp(v,0,100)}%;background:${c}"></i></div>`;
 return `<div class="hud"><div class="r1"><b>${S.ch}</b><span>Day ${S.day}, ${clock()} ${WX[S.wx]}</span></div><div class="r2"><div>❤️${b(S.hp,'#e5533d')}</div><div>⚡${b(S.en,'#F4B400')}</div></div><div class="r3"><span>${fmt(S.cash)} cash</span><span>${fmt(S.bank)} bank</span><span>${ME?`<button onclick="window.hub&&hub()" aria-label="Online hub">🌐${ME.unread?`<sup>${ME.unread}</sup>`:''}</button> `:''}<button onclick="phone()" aria-label="Open phone">📱</button></span></div></div>`}
const OUT=['road','city','gate','parade','field','market','grove','cds','aerial','park','queue'];
const AV={Mama:'👩🏾',Papa:'👨🏾',Officer:'🧑🏾‍✈️',Soldier:'🪖',Whistle:'📣',Vendor:'🧑🏾‍🍳',Trader:'🧑🏾‍💼',Driver:'🧑🏾‍✈️',Conductor:'🚌',Dami:'😊',Landlord:'🧓🏾',Agent:'🕴️',Supervisor:'👔',SMS:'📱',Letter:'📄','Posting letter':'✉️','Corpers group chat':'💬',Seller:'🛍️','Group coordinator':'🧑🏾‍🤝‍🧑🏾','Mama Put':'👩🏾‍🍳',Barber:'💈',Official:'🧑🏾‍💼'};
function seg(t){try{return[...new Intl.Segmenter().segment(t)].map(x=>x.segment)}catch(e){return Array.from(t)}}
function stageHtml(o,a,h,tint){
 const out=OUT.includes(a),night=S&&(h<5||h>=19);

 const step=m=>{view({a:'market',t:'Haggling: '+item,x:[[vendor,m],`Asking price: <b>${fmt(ask)}</b> (round ${Math.min(round+1,3)} of 3)`],c:
  (round<3?[{t:'Offer 40% off',f:()=>off(.4)},{t:'Offer 25% off',f:()=>off(.25)},{t:'Offer 10% off',f:()=>off(.1)}]:[]).concat([
  {t:'Pay '+fmt(ask),p:1,d:total()<ask,f:()=>fin(ask)},{t:'Walk away',f:()=>{if(chance(.5+S.sk.comm*.03)){round++;ask=Math.max(min,Math.round((ask+min)/100)*50);step('Corper! Come back! '+fmt(ask)+', final!')}else done(null)}}])})};
 const off=p=>{const o=Math.round(ask*(1-p)/50)*50;if(o>=min){snd(660);fin(o,1)}else{round++;ask=Math.max(min,Math.round((ask+o)/100)*50);step(rnd(lines))}};

}

 view({a:'ceremony',t:'Ending: '+name,x:[txt,`Final stats: ${fmt(total())} saved, PALAVA events survived: ${S.palava}, CDS meetings: ${S.cds}, places explored: ${S.explored}.${S.bets?` Betting net: ${S.betNet<0?'-':''}${fmt(Math.abs(S.betNet))}.${S.betNet<=-30000?' Those betting losses were a hard lesson.':''}`:''}`,`Reputation: Camp ${S.rep.camp}, PPA ${S.rep.ppa}, Community ${S.rep.comm}, Friendship ${S.rep.friend}, Professional ${S.rep.prof}`,"<b>Serve Your Fatherland. Survive the PALAVA. You did it.</b>"],c:[extra?{t:'Serve the 3-week extension',s:'Get your certificate cleared',p:1,f:extension}:{t:'🎓 View my certificate',p:1,f:showCert},{t:'Play again',f:()=>{CERT=null;title()}}]});
}
async function extension(){
 S.endingName='Extra PALAVA (Extended)';S.day+=21;await save(true);
 res(['Three extra weeks at the PPA. Every form is signed, every stamp is dry and the officer finally smiles.','Your certificate has been cleared.'],showCert,'ceremony','Collect my certificate');
}

function palava(ctx,next){
 const okE=e=>e.c.includes(ctx)&&(e.id!=='banker'||CFG.bettingEnabled);const pool=EV.filter(e=>okE(e)&&!S.seen.slice(-6).includes(e.id));
 const e=rnd(pool.length?pool:EV.filter(okE));
 S.seen.push(e.id);S.palava++;
 view({a:ctx==='camp'?'hostel':ctx==='travel'?'road':'city',t:'PALAVA! '+e.t,x:[e.x],c:e.o.map(o=>({t:o.t,s:typeof o.s==='function'?o.s():o.s,d:(typeof o.d==='function'?o.d():o.d)||(o.cost&&total()<o.cost),f:()=>{const r=o.f();snd(260);r[1]&&r[1]();res([r[0]],next,ctx==='camp'?'hostel':ctx==='travel'?'road':'city')}}))});
}

/* ============ PHONE ============ */
function phone(tab){
 if(!S)return;tab=tab||'chat';
 const T=[['chat','💬 Chat'],['bank','🏦 Bank'],['map','🗺️ Map'],['me','👤 Me'],['menu','⚙️ Menu']];
 let c='';
 if(tab==='chat')c=(S.chat.length?S.chat.map(m=>`<div class="m"><b>${m.from}</b> (day ${m.day})<br>${m.text}</div>`).join(''):'<div class="m">No messages yet. Your phone buzzes only when something PALAVA happens.</div>');
 if(tab==='bank')c=`<div class="m"><b>Cash</b> ${fmt(S.cash)}<br><b>Bank</b> ${fmt(S.bank)}<br><b>Allawee:</b> ${fmt(CFG.allowance+(S.ppa?S.ppa.pay:0))}/month${S.arrears?'<br><b>Owed to you (arrears):</b> '+fmt(S.arrears):''}${S.debt?'<br><b>You owe a friend:</b> '+fmt(S.debt):''}${S.shop?'<br><b>Shop level:</b> '+S.shop:''}</div><button class="btn" onclick="atm(5000)">Withdraw ₦5,000</button><button class="btn" onclick="atm(-5000)">Deposit ₦5,000</button>`;
 if(tab==='map')c=`<div class="m"><b>You are in:</b> ${S.ppa?S.ppa.city+', '+S.ppa.st+' State':'Camp / en route'}<br><b>Phase:</b> ${S.ch}</div>${S.ppa?'<div class="m">Use "Explore" in the monthly menu to visit local landmarks. Fast travel unlocks in the full game.</div>':''}`;
 if(tab==='me')c=`<div class="m"><b>${S.name}</b>, ${S.course}, ${S.pers}</div><div class="m"><div class="kv">${Object.entries(S.sk).map(([k,v])=>`<span>${k}</span><b>${v}</b>`).join('')}</div></div><div class="m"><div class="kv">${Object.entries(S.rep).map(([k,v])=>`<span>${k} rep</span><b>${v}</b>`).join('')}</div></div><div class="m"><div class="kv"><span>style</span><b>${S.style}</b><span>betting net</span><b>${S.betNet<0?'-':''}${fmt(Math.abs(S.betNet))}</b></div></div>`;
 if(tab==='menu')c=`<button class="btn" onclick="closePh();saveNow()">💾 Save game now</button><button class="btn" onclick="saveNow(true)">Save and quit to title</button><div class="m">${ME?'Signed in as <b>'+E(ME.username)+'</b>. Your game also auto-saves every action.':'Playing as guest: saves stay on this device. Sign in from the title screen to save to your account.'}</div>`;
 $('#ph').innerHTML=`<div class="ph" onclick="if(event.target===this)closePh()"><div><div class="tabs">${T.map(t=>`<button class="${t[0]===tab?'on':''}" onclick="phone('${t[0]}')">${t[1]}</button>`).join('')}</div>${c}<button class="btn" onclick="closePh()">Close</button></div></div>`;
}
function closePh(){$('#ph').innerHTML=''}
function atm(n){if(n>0){if(S.bank>=n){S.bank-=n;S.cash+=n}else toast('Insufficient bank balance',1)}else{if(S.cash>=-n){S.cash+=n;S.bank-=n}else toast('Not enough cash',1)}phone('bank');$('#hud').innerHTML=hudHtml()}

title();
</script>
<script>
let palavaInstallPrompt=null;
window.addEventListener("beforeinstallprompt",event=>{event.preventDefault();palavaInstallPrompt=event;});

 if(palavaInstallPrompt){palavaInstallPrompt.prompt();const choice=await palavaInstallPrompt.userChoice;palavaInstallPrompt=null;if(choice&&choice.outcome==="accepted"&&typeof toast==="function")toast("Installing PALAVA…");return;}
 const ios=/iphone|ipad|ipod/i.test(navigator.userAgent)&&!window.MSStream;
 alert(ios?"To install PALAVA on iPhone: tap Share in Safari, then choose Add to Home Screen.":"To install PALAVA: open your browser menu (⋮ or …) and choose Install app or Add to Home Screen. If the option is missing, open the site in Chrome or Edge and try again.");
};
