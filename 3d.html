{name:'Ogun',capital:'Abeokuta',scene:1,missions:['Visit the rock-side community','Help a local business digitise','Attend a skills workshop'],vibe:'rocky hills and industrial towns'},

const ground=mesh(new THREE.PlaneGeometry(240,240),mat(0x477c47),0,-.25,0);ground.rotation.x=-Math.PI/2;
box(scene,0,-.05,-24,10,.12,170,mat(0x424946));for(let z=-100;z<60;z+=7)box(scene,0,.02,z,.12,.02,3,mat(0xe7d8ac));
const worldGroup=new THREE.Group();scene.add(worldGroup);
function makeTree(x,z,s=1){let g=new THREE.Group();g.position.set(x,0,z);worldGroup.add(g);mesh(new THREE.CylinderGeometry(.12*s,.19*s,1.4*s,8),mat(0x64442e),0,.7*s,0,g);for(let i=0;i<3;i++){let c=mesh(new THREE.IcosahedronGeometry(.72*s,2),mat([0x28633a,0x397d42,0x2e6c39][i]),(i-1)*.27*s,(1.45+i*.23)*s,0,g);c.scale.y=1.2}}

for(let i=0;i<12;i++){let z=-85+i*12;makeBuilding(i%2?-8:8,z,4+Math.random()*2,3+Math.random()*4,5,[0xd8c9a7,0xd4d9c9,0xc7c3ad,0xc5d5d5][i%4])}

box(character,0,1.28,0,.62,.78,.34,khaki);box(character,0,1.72,0,.66,.13,.38,mat(0x536d3b));const head=mesh(new THREE.SphereGeometry(.22,24,18),skin,0,1.96,0,character);mesh(new THREE.SphereGeometry(.23,20,12,0,Math.PI*2,0,Math.PI*.52),dark,0,2.03,0,character);box(character,0,2.2,0,.47,.08,.42,khaki);
const legs=[],arms=[];[-1,1].forEach(side=>{let leg=box(character,side*.17,.55,0,.19,.62,.22,khaki);box(character,side*.17,.15,.06,.22,.15,.34,dark);legs.push(leg);let arm=box(character,side*.43,1.27,0,.16,.62,.17,khaki);arms.push(arm)});

function rebuildState(){while(worldGroup.children.length)worldGroup.remove(worldGroup.children[0]);let st=states[stateIndex];scene.background=new THREE.Color([0x9ccbd9,0xa8c8d1,0xa2c8d5,0xb0d2dc,0x99c6d0,0xa8d1df][stateIndex]);scene.fog.color.copy(scene.background);for(let z=-100;z<50;z+=9){makeTree(-8-(z%3),z,.8+Math.random()*.5);makeTree(8+(z%4),z,.8+Math.random()*.5)}for(let i=0;i<12;i++){let z=-85+i*12;makeBuilding(i%2?-8:8,z,4+Math.random()*2,3+Math.random()*4,5,[0xd8c9a7,0xd4d9c9,0xc7c3ad,0xc5d5d5][(i+stateIndex)%4])} $('statePill').textContent=st.name+' State';$('missionTitle').textContent=st.missions[missionIndex%st.missions.length].toUpperCase();$('missionText').textContent='Explore '+st.capital+' and '+st.vibe+'. Walk to a golden marker or complete the mission.'}
function openModal(title,html){$('modalTitle').textContent=title;$('modalBody').innerHTML=html;$('modalWrap').style.display='flex'}
$('closeModal').onclick=()=>$('modalWrap').style.display='none';$('backBtn').onclick=()=>location.href='/';$('statesBtn').onclick=()=>openModal('EXPLORE SOUTHWEST NIGERIA','<p class="muted">Choose one of the six states to explore its capital, missions and scenery.</p><div class="grid">'+states.map((s,i)=>'<button class="card" data-state="'+i+'"><b>'+s.name+' State</b><div class="muted">'+s.capital+'</div><small>'+s.vibe+'</small></button>').join('')+'</div>');$('missionsBtn').onclick=()=>openModal('SERVICE YEAR MISSIONS','<div class="grid">'+states[stateIndex].missions.map((m,i)=>'<div class="card"><b>Mission '+(i+1)+'</b><p>'+m+'</p><button data-mission="'+i+'">Set as active</button></div>').join('')+'<div class="card"><b>Side quests</b><p>Help a neighbour, join CDS, find a skills mentor, take a cultural photo, help a small business.</p></div></div>');

$('missionBtn').onclick=()=>{xp+=100;completed++;missionIndex++;if(missionIndex%3===0)day++;$('xpPill').textContent='XP '+xp;$('dayPill').textContent='Day '+day;rebuildState();};
$('gamesBtn').onclick=()=>showGames();$('socialBtn').onclick=()=>showLobby();
$('closeModal').onclick=()=>{$('modalWrap').style.display='none';if(hubTimer){clearInterval(hubTimer);hubTimer=null;}};
async function api(path,options={}){const r=await fetch(path,{credentials:'same-origin',...options,headers:{'Content-Type':'application/json',...(options.headers||{})}});let data={};try{data=await r.json()}catch(_){}if(!r.ok)throw new Error(data.error||('Request failed ('+r.status+')'));return data;}
function showGames(){if(hubTimer){clearInterval(hubTimer);hubTimer=null;}openModal('MINI-GAMES','<p class="muted">Choose a quick local mini-game. These are playable prototypes; official rules are not fully implemented yet.</p><div class="grid"><button class="card" data-localgame="ludo">🎲 Ludo practice</button><button class="card" data-localgame="whot">🃏 Whot practice</button><button class="card" data-localgame="ayo">🪘 Ayo Opon practice</button><button class="card" data-localgame="chess">♟ Chess practice</button></div><div id="localGame"></div>');}
function startLocalGame(game){const host=$('localGame');if(!host)return;
if(game==='ludo'){let pos=0;host.innerHTML='<div class="card"><b>Ludo practice</b><p id="localStatus">Roll to move your token.</p><button id="rollDie">🎲 Roll die</button></div>';host.querySelector('#rollDie').onclick=()=>{let n=1+Math.floor(Math.random()*6);pos=Math.min(57,pos+n);host.querySelector('#localStatus').textContent='Rolled '+n+'. Token square '+pos+(pos===57?' — finish!':'')+'.';};}
else if(game==='whot'){let deck=['Circle','Triangle','Cross','Square','Star'],top=deck[Math.floor(Math.random()*5)];host.innerHTML='<div class="card"><b>Whot practice</b><p id="whotTop">Top card: '+top+'</p><div class="grid">'+deck.map(s=>'<button data-card="'+s+'">'+s+'</button>').join('')+'</div><p id="whotResult"></p></div>';host.querySelectorAll('[data-card]').forEach(b=>b.onclick=()=>{if(b.dataset.card===top){top=deck[Math.floor(Math.random()*5)];host.querySelector('#whotResult').textContent='Match! New card drawn.';host.querySelector('#whotTop').textContent='Top card: '+top;}else host.querySelector('#whotResult').textContent='Not a match. Try the same shape as the top card.';});}
else if(game==='ayo'){let pits=Array(12).fill(4);host.innerHTML='<div class="card"><b>Ayo Opon practice</b><p>Tap one of your first six pits to sow seeds. Traditional capture rules are not fully implemented.</p><div class="grid">'+pits.map((n,i)=>'<button data-pit="'+i+'">Pit '+(i+1)+'<br><b id="pitN'+i+'">'+n+'</b></button>').join('')+'</div><p id="ayoStatus"></p></div>';host.querySelectorAll('[data-pit]').forEach(b=>b.onclick=()=>{let i=+b.dataset.pit;if(i>5){host.querySelector('#ayoStatus').textContent='Choose one of your six pits.';return;}let n=pits[i];pits[i]=0;for(let k=1;k<=n;k++)pits[(i+k)%12]++;pits.forEach((v,j)=>host.querySelector('#pitN'+j).textContent=v);host.querySelector('#ayoStatus').textContent='Sowed '+n+' seeds.';});}
else{let p=['♜','♞','♝','♛','♚','♝','♞','♜'],board=Array.from({length:64},(_,i)=>i<8?p[i]:i>=56?p[i-56]:'');let selected=null;host.innerHTML='<div class="card"><b>Chess practice</b><p id="chessStatus">Tap a piece, then a destination. Legal chess rules are not enforced.</p><div style="display:grid;grid-template-columns:repeat(8,minmax(22px,1fr));gap:2px">'+board.map((v,i)=>'<button data-square="'+i+'" style="padding:5px 0;min-width:0;background:'+((Math.floor(i/8)+i%8)%2?'#b6c5a1':'#e8e2cf')+';color:#18241b">'+v+'</button>').join('')+'</div></div>';host.querySelectorAll('[data-square]').forEach(b=>b.onclick=()=>{let i=+b.dataset.square;if(selected===null){if(!board[i])return;selected=i;host.querySelector('#chessStatus').textContent='Piece selected. Choose destination.';}else{board[i]=board[selected];board[selected]='';selected=null;host.querySelectorAll('[data-square]').forEach((x,j)=>x.textContent=board[j]);host.querySelector('#chessStatus').textContent='Move made. Simplified local board only.';}});}}
async function showLobby(){if(hubTimer){clearInterval(hubTimer);hubTimer=null;}openModal('MULTIPLAYER LOBBY','<p class="muted">Sign in on the main game first. Room actions and event feeds are shared; boards are not yet fully synchronized.</p><div class="grid"><button class="card" data-create="ludo">Create Ludo room</button><button class="card" data-create="whot">Create Whot room</button><button class="card" data-create="ayo">Create Ayo Opon room</button><button class="card" data-create="chess">Create Chess room</button></div><button id="refreshRooms">Refresh rooms</button><div id="roomList">Loading rooms…</div><div id="roomPlay"></div>');await refreshRooms();}
async function refreshRooms(){const list=$('roomList');if(!list)return;try{const data=await api('/api/multiplayer/rooms');list.innerHTML=data.rooms.length?data.rooms.map(r=>'<div class="card"><b>'+esc(r.title)+'</b><p>'+esc(r.game.toUpperCase())+' · '+r.players.length+'/'+r.maxPlayers+' players · '+esc(r.status)+'</p><small>Room '+esc(r.id)+'</small> <button data-join="'+esc(r.id)+'">Join room</button></div>').join(''):'<p class="muted">No open rooms. Create one to start.</p>';}catch(e){list.innerHTML='<p class="muted">'+esc(e.message)+' — sign in on the main game first.</p>';}}

function renderRoom(room){const play=$('roomPlay');if(!play)return;play.innerHTML='<div class="card"><b>'+esc(room.title)+' · '+esc(room.id)+'</b><p>Players: '+room.players.map(p=>esc(p.displayName)).join(', ')+'</p><div id="roomFeed" class="log">'+room.events.map(ev=>'<p><small>'+esc(ev.type)+'</small> '+esc(ev.text)+'</p>').join('')+'</div><div class="row"><input id="roomAction" placeholder="Type a move or message" maxlength="180"><button id="sendRoomAction">Send action</button></div><button id="leaveRoom">Leave room</button></div>';const feed=play.querySelector('#roomFeed');if(feed)feed.scrollTop=feed.scrollHeight;play.querySelector('#sendRoomAction').onclick=async()=>{const input=play.querySelector('#roomAction');try{await api('/api/multiplayer/rooms/'+encodeURIComponent(room.id)+'/move',{method:'POST',body:JSON.stringify({text:input.value})});input.value='';await openRoom(room.id);}catch(e){alert(e.message);}};play.querySelector('#leaveRoom').onclick=async()=>{try{await api('/api/multiplayer/rooms/'+encodeURIComponent(room.id)+'/leave',{method:'POST',body:'{}'});activeRoom=null;if(hubTimer){clearInterval(hubTimer);hubTimer=null;}play.innerHTML='<p class="muted">You left the room.</p>';await refreshRooms();}catch(e){alert(e.message);}};}
$('modalBody').addEventListener('click',async e=>{const g=e.target.closest('[data-localgame]');if(g){startLocalGame(g.dataset.localgame);return;}const c=e.target.closest('[data-create]');if(c){try{const d=await api('/api/multiplayer/rooms',{method:'POST',body:JSON.stringify({game:c.dataset.create})});await openRoom(d.room.id);await refreshRooms();}catch(err){alert(err.message+' Sign in on the main game first.');}return;}const j=e.target.closest('[data-join]');if(j){try{await api('/api/multiplayer/rooms/'+encodeURIComponent(j.dataset.join)+'/join',{method:'POST',body:'{}'});await openRoom(j.dataset.join);}catch(err){alert(err.message);}return;}if(e.target.closest('#refreshRooms'))await refreshRooms();});

$('modalBody').addEventListener('click',e=>{let s=e.target.closest('[data-state]');if(s){stateIndex=+s.dataset.state;missionIndex=0;character.position.set(0,0,5);rebuildState();$('modalWrap').style.display='none'}let m=e.target.closest('[data-mission]');if(m){missionIndex=+m.dataset.mission;rebuildState();$('modalWrap').style.display='none'}});
window.addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault()});window.addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);document.querySelectorAll('[data-move]').forEach(b=>{b.addEventListener('touchstart',e=>{e.preventDefault();moveTouch=b.dataset.move},{passive:false});b.addEventListener('touchend',()=>moveTouch='')});
function animate(t){requestAnimationFrame(animate);let dx=0,dz=0;if(keys.w||keys.arrowup||moveTouch==='up')dz-=1;if(keys.s||keys.arrowdown||moveTouch==='down')dz+=1;if(keys.a||keys.arrowleft||moveTouch==='left')dx-=1;if(keys.d||keys.arrowright||moveTouch==='right')dx+=1;let moving=dx||dz;if(moving){let speed=(keys.shift ? .13 : .075);let len=Math.hypot(dx,dz);character.position.x+=dx/len*speed*16;character.position.z+=dz/len*speed*16;character.position.x=Math.max(-5,Math.min(5,character.position.x));character.position.z=Math.max(-85,Math.min(12,character.position.z));character.rotation.y=Math.atan2(dx,dz);legs[0].rotation.x=Math.sin(t*.012)*.6;legs[1].rotation.x=-legs[0].rotation.x;arms[0].rotation.x=-legs[0].rotation.x*.65;arms[1].rotation.x=-legs[1].rotation.x*.65}else{legs.forEach(l=>l.rotation.x=0);arms.forEach(a=>a.rotation.x=0)}camera.position.lerp(new THREE.Vector3(character.position.x,character.position.y+5.3,character.position.z+10),.08);camera.lookAt(character.position.x,1,character.position.z-3);markerGroup.children.forEach((m,i)=>{m.rotation.y=t*.0006;m.children[1].position.y=1.2+Math.sin(t*.003+i)*.2});bus.position.z=Math.sin(t*.0005)*20-12;renderer.render(scene,camera)}

}

function showEngineFallback(){
  const modal=document.getElementById('modalWrap'), body=document.getElementById('modalBody');
  const title=document.getElementById('modalTitle');
  const stateNames=['Lagos','Ogun','Oyo','Osun','Ondo','Ekiti'];
  const capitals=['Ikeja','Abeokuta','Ibadan','Osogbo','Akure','Ado-Ekiti'];
  let game=''; 
  const open=(t,h)=>{title.textContent=t;body.innerHTML=h;modal.style.display='flex';};
  const menu=()=>open('PALAVA MINI-GAMES','<p>3D graphics could not load on this connection, but the mini-games are available here.</p><div class="grid"><button data-game="ludo">🎲 Ludo</button><button data-game="whot">🃏 Whot</button><button data-game="ayo">🪘 Ayo Opon</button><button data-game="chess">♟ Chess board</button></div><div id="fallbackGame"></div>');
  document.getElementById('gamesBtn').onclick=menu;
  document.getElementById('socialBtn').onclick=()=>open('MULTIPLAYER','<p>Multiplayer needs the 3D client engine in this build. Return to the main game to sign in and access your account.</p><a href="/">Open main game</a>');
  document.getElementById('statesBtn').onclick=()=>open('SOUTHWEST NIGERIA','<div class="grid">'+stateNames.map((s,i)=>'<div class="card"><b>'+s+' State</b><p>'+capitals[i]+'</p></div>').join('')+'</div>');
  document.getElementById('missionsBtn').onclick=()=>open('SERVICE YEAR MISSIONS','<div class="card"><b>Orientation camp</b><p>Meet fellow corps members, complete camp drills and learn the NYSC routine.</p></div><div class="card"><b>Place of Primary Assignment</b><p>Report to your supervisor, contribute to your community and build your skills.</p></div><div class="card"><b>Community Development Service</b><p>Organise a sanitation drive, support a school or help a local business.</p></div>');
  document.getElementById('missionBtn').onclick=()=>open('MISSION UPDATE','<p>Your next mission is ready. Please retry the 3D page when your connection allows the graphics engine to load.</p>');
  document.getElementById('backBtn').onclick=()=>location.href='/';
  document.getElementById('closeModal').onclick=()=>modal.style.display='none';
  body.addEventListener('click',e=>{
    const b=e.target.closest('[data-game]'); if(!b)return;
    game=b.dataset.game; const host=document.getElementById('fallbackGame');
    if(game==='ludo'){let pos=0;host.innerHTML='<div class="card"><b>Ludo</b><p id="fbStatus">Roll the die to move.</p><button id="fbRoll">🎲 Roll</button></div>';host.querySelector('#fbRoll').onclick=()=>{let n=1+Math.floor(Math.random()*6);pos=Math.min(57,pos+n);host.querySelector('#fbStatus').textContent='You rolled '+n+'. Token position '+pos+(pos===57?' — home!':'');};}
    else if(game==='whot'){let suits=['Circle','Triangle','Cross','Square','Star'],top=suits[Math.floor(Math.random()*5)];host.innerHTML='<div class="card"><b>Whot</b><p id="fbTop">Top card: '+top+'</p><div class="grid">'+suits.map(s=>'<button data-suit="'+s+'">'+s+'</button>').join('')+'</div><p id="fbResult"></p></div>';host.querySelectorAll('[data-suit]').forEach(x=>x.onclick=()=>{if(x.dataset.suit===top){top=suits[Math.floor(Math.random()*5)];host.querySelector('#fbTop').textContent='Top card: '+top;host.querySelector('#fbResult').textContent='Correct match!';}else host.querySelector('#fbResult').textContent='Try matching the top card.';});}
    else if(game==='ayo'){let pits=Array(12).fill(4);host.innerHTML='<div class="card"><b>Ayo Opon</b><p>Tap a pit on your row to sow seeds.</p><div class="grid">'+pits.map((v,i)=>'<button data-pit="'+i+'">Pit '+(i+1)+'<br><b id="fbPit'+i+'">'+v+'</b></button>').join('')+'</div><p id="fbAyo"></p></div>';host.querySelectorAll('[data-pit]').forEach(x=>x.onclick=()=>{let i=+x.dataset.pit;if(i>5){host.querySelector('#fbAyo').textContent='Choose one of your six pits.';return;}let n=pits[i];pits[i]=0;for(let k=1;k<=n;k++)pits[(i+k)%12]++;pits.forEach((v,j)=>host.querySelector('#fbPit'+j).textContent=v);host.querySelector('#fbAyo').textContent='Sowed '+n+' seeds.';});}
    else {const pieces=['♜','♞','♝','♛','♚','♝','♞','♜'];let board=Array(64).fill('');pieces.forEach((p,i)=>{board[i]=p;board[56+i]=p;});let selected=null;host.innerHTML='<div class="card"><b>Chess board</b><p id="fbChess">Select a piece, then a square.</p><div style="display:grid;grid-template-columns:repeat(8,minmax(22px,1fr));gap:2px">'+board.map((p,i)=>'<button data-sq="'+i+'" style="padding:4px 0;min-width:0;background:'+((Math.floor(i/8)+i%8)%2?'#b6c5a1':'#e8e2cf')+';color:#18241b">'+p+'</button>').join('')+'</div></div>';host.querySelectorAll('[data-sq]').forEach(x=>x.onclick=()=>{let i=+x.dataset.sq;if(selected===null){if(!board[i])return;selected=i;host.querySelector('#fbChess').textContent='Piece selected. Choose destination.';}else{board[i]=board[selected];board[selected]='';selected=null;host.querySelectorAll('[data-sq]').forEach((el,j)=>el.textContent=board[j]);host.querySelector('#fbChess').textContent='Move made (practice board; legal chess rules are not enforced).';}});}
  });
  document.getElementById('modalWrap').style.display='none';
  const warning=document.createElement('div');warning.className='brand';warning.style.cssText='position:fixed;left:12px;top:90px;max-width:300px;z-index:4;background:#542b16;border:1px solid #ffcc88;padding:12px;border-radius:12px';warning.innerHTML='<b>3D engine did not load</b><p style="margin:6px 0">Mini-games are still available. Check your connection and reload for the 3D world.</p>';document.body.appendChild(warning);
  document.getElementById('gamesBtn').click();
}
let palavaBooted=false;
function startPALAVA3D(){
  if(palavaBooted)return;
  palavaBooted=true;
  try{bootPALAVA();}catch(e){console.error('PALAVA 3D startup failed:',e);showEngineFallback();}
}
function loadThreeFrom(index){
  const cdns=[
    'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js',
    'https://unpkg.com/three@0.160.0/build/three.min.js'
  ];
  if(window.THREE){startPALAVA3D();return;}
  if(index>=cdns.length){showEngineFallback();return;}
  const script=document.createElement('script');
  script.src=cdns[index];
  script.async=true;
  script.onload=()=>window.THREE?startPALAVA3D():loadThreeFrom(index+1);
  script.onerror=()=>loadThreeFrom(index+1);
  document.head.appendChild(script);
}
if(window.THREE){startPALAVA3D();}else{loadThreeFrom(0);}
</script></body></html>
